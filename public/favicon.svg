<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="mask"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#mask)">
    <!-- 斜向平铺的水印条纹（超出边界由圆角遮罩裁切，暗示重复铺满） -->
    <g transform="rotate(-18 32 32)" fill="#FFFFFF">
      <rect x="-6" y="13" width="34" height="5" rx="2.5" fill-opacity="0.45"/>
      <rect x="8" y="24" width="52" height="5" rx="2.5" fill-opacity="0.8"/>
      <rect x="22" y="35" width="52" height="5" rx="2.5" fill-opacity="0.55"/>
      <rect x="36" y="46" width="34" height="5" rx="2.5" fill-opacity="0.35"/>
    </g>
    <!-- 照片卡片：太阳 + 山峰的极简图像图标 -->
    <g transform="rotate(-5 32 33)">
      <rect x="16" y="19" width="32" height="25" rx="4.5" fill="#F5F7FF" stroke="#C7D2FE" stroke-width="1.2"/>
      <circle cx="23.5" cy="27" r="3" fill="#A5B4FC"/>
      <path d="M16 44l9-11 7 7 10-11 6 6.5V44H16z" fill="#818CF8"/>
    </g>
    <!-- 压过卡片的主水印条纹（印章感，避开山峰/太阳的交叠区） -->
    <g transform="rotate(-18 32 32)">
      <rect x="14" y="33.4" width="40" height="4.4" rx="2.2" fill="#FFFFFF" fill-opacity="0.88"/>
    </g>
  </g>
</svg>
