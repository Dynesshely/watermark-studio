<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="水印工坊 - 纯浏览器本地图片水印工具，图片不上传服务器" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>水印工坊 · 本地图片水印工具</title>
    <script>
      // 启动前应用主题与界面语言（避免闪烁 / 英文用户先看到中文标题）
      try {
        var raw = localStorage.getItem('wmstudio.settings.v1')
        var cfg = raw ? JSON.parse(raw) : null
        var theme = (cfg && cfg.theme) || 'system'
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')

        var stored = cfg && cfg.lang
        var lang =
          stored === 'zh' || stored === 'en'
            ? stored
            : /^zh\b/i.test(navigator.language || '')
              ? 'zh'
              : 'en'
        document.documentElement.lang = lang
        if (lang === 'en') {
          document.title = 'Watermark Studio · Local image watermark tool'
          var meta = document.querySelector('meta[name="description"]')
          if (meta)
            meta.setAttribute(
              'content',
              'Watermark Studio - a browser-only image watermark tool; images are never uploaded',
            )
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
