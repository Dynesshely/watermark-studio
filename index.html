<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="水印工坊 - 纯浏览器本地图片水印工具，图片不上传服务器" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>水印工坊 · 本地图片水印工具</title>
    <script>
      // 启动前按本地存储应用主题，避免闪烁
      try {
        var raw = localStorage.getItem('wmstudio.settings.v1')
        var t = raw ? JSON.parse(raw).theme : 'system'
        var dark =
          t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
